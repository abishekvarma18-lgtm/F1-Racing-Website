{% load static %} 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'icon.png' %}">
    <title>Register Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Titillium Web', Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#0B0F1A;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(225,6,0,0.10), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(225,6,0,0.06), transparent 45%);
            padding:30px 16px;
        }

        .container{
            background:#15192A;
            width:380px;
            max-width:100%;
            border-radius:14px;
            border:1px solid #232A3D;
            box-shadow:0 20px 50px rgba(0,0,0,0.45);
            overflow:hidden;
            position:relative;
        }

        /* racing stripe accent */
        .container::before{
            content:"";
            display:block;
            height:6px;
            width:100%;
            background:repeating-linear-gradient(
                -45deg,
                #E10600 0px, #E10600 18px,
                #ffffff 18px, #ffffff 26px,
                #E10600 26px, #E10600 44px
            );
        }

        .form-wrap{
            padding:38px 34px 32px;
        }

        .container h2{
            font-family:'Orbitron', sans-serif;
            font-weight:800;
            font-size:26px;
            letter-spacing:1px;
            text-align:center;
            color:#fff;
            margin-bottom:6px;
        }

        .subtext{
            text-align:center;
            color:#7C8494;
            font-size:13px;
            margin-bottom:26px;
            letter-spacing:0.3px;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:6px;
            font-size:12px;
            font-weight:600;
            letter-spacing:0.6px;
            text-transform:uppercase;
            color:#9AA3B2;
        }

        .input-group input{
            width:100%;
            padding:12px 14px;
            background:#0F1320;
            border:1px solid #2A3145;
            border-radius:7px;
            color:#fff;
            font-size:15px;
            transition:border-color .2s ease, box-shadow .2s ease;
        }

        .input-group input::placeholder{
            color:#4C5568;
        }

        .input-group input:focus{
            outline:none;
            border-color:#E10600;
            box-shadow:0 0 0 3px rgba(225,6,0,0.18);
        }

        button{
            width:100%;
            padding:14px;
            margin-top:8px;
            background:#E10600;
            color:#fff;
            border:none;
            border-radius:7px;
            cursor:pointer;
            font-size:15px;
            font-weight:700;
            letter-spacing:0.8px;
            text-transform:uppercase;
            transition:.25s ease;
        }

        button:hover{
            background:#ff2418;
            box-shadow:0 8px 22px rgba(225,6,0,0.35);
            transform:translateY(-1px);
        }

        /* animated race line under the button, echoes .red-line elsewhere on the site */
        .race-line{
            width:100%;
            height:3px;
            margin-top:22px;
            border-radius:10px;
            background:linear-gradient(90deg, transparent, #E10600, #fff, #E10600, transparent);
            background-size:200% 100%;
            animation:f1line 3s linear infinite;
            box-shadow:0 0 10px rgba(225,6,0,0.6);
        }

        @keyframes f1line{
            0%{ background-position:200% 0; }
            100%{ background-position:-200% 0; }
        }

        .login-link{
            text-align:center;
            margin-top:22px;
            font-size:13.5px;
            color:#7C8494;
        }

        .login-link a{
            color:#E10600;
            text-decoration:none;
            font-weight:600;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        .error{
            color:#ff5c5c;
            font-size:13px;
            margin-top:4px;
            margin-bottom:10px;
            text-align:center;
        }

        @media (max-width:420px){
            .form-wrap{
                padding:30px 22px 26px;
            }
            .container h2{
                font-size:22px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-wrap">
            <h2>REGISTER</h2>
            <p class="subtext">Create your account to join the grid</p>

            <form method="POST">
                {% csrf_token %}

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" name="name" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label>Username</label>
                    <input type="text" name="username" id="username" placeholder="Choose a username" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" name="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirmPassword" id="confirmPassword" placeholder="••••••••" required>
                </div>

                {% if error %}
                <p class="error">{{ error }}</p>
                {% endif %}

                <button type="submit">Register</button>
                <div class="race-line"></div>
            </form>

            <div class="login-link">
                Already have an account? <a href="{% url 'login' %}">Login</a>
            </div>
        </div>
    </div>

</body>
</html>
